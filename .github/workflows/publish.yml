name: publish

# Rebuilds the package source from the latest release of every repository
# in packages.txt, signs the index and publishes it with GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the latest release of each package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          while read -r repo; do
            [ -n "$repo" ] || continue
            gh release download -R "$repo" --pattern '*.ipk' -D site
          done < packages.txt
          ls -l site

      - name: Build the package index
        run: scripts/build-feed.sh site

      - name: Sign the index (usign, as on OpenWrt)
        env:
          USIGN_SECRET_KEY: ${{ secrets.USIGN_SECRET_KEY }}
        run: |
          umask 077
          printf '%s\n' "$USIGN_SECRET_KEY" > "$RUNNER_TEMP/usign.sec"
          cp chaffed.pub site/
          docker run --rm -v "$PWD/site:/site" -v "$RUNNER_TEMP:/key:ro" openwrt/rootfs:x86-64-23.05.6 \
            sh -c 'usign -S -m /site/Packages -s /key/usign.sec -x /site/Packages.sig && usign -V -m /site/Packages -p /site/chaffed.pub'
          rm -f "$RUNNER_TEMP/usign.sec"

      - name: Add the web site (landing page, setup scripts, pictures)
        run: cp -R web/. site/

      - name: Check the setup scripts
        run: |
          shellcheck web/setup.sh web/install.sh
          docker run --rm -v "$PWD/web:/web:ro" mcr.microsoft.com/powershell:lts-alpine-3.20 pwsh -NoProfile -Command \
            '$e = $null; [System.Management.Automation.Language.Parser]::ParseFile("/web/install.ps1", [ref]$null, [ref]$e) | Out-Null; if ($e) { $e; exit 1 }'

      - name: Add the package source to a clean OpenWrt 23.05 and install every app (setup.sh, against this build)
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 --directory site > /dev/null 2>&1 &
          sleep 2
          docker run --rm --network host openwrt/rootfs:x86-64-23.05.6 sh -c '
            set -e
            mkdir -p /var/lock /var/run
            wget -qO /tmp/setup.sh http://127.0.0.1:8099/setup.sh
            CHAFFED_FEED=http://127.0.0.1:8099 sh /tmp/setup.sh all
            for p in $(sed -n "s/^Package: //p" /var/opkg-lists/chaffed); do
              opkg list-installed "$p" | grep -q . || { echo "FAIL $p is not installed"; exit 1; }
              echo "ok   $p installed"
            done
            echo "--- run again: changes nothing"
            CHAFFED_FEED=http://127.0.0.1:8099 sh /tmp/setup.sh | grep -q "^Added" && { echo "FAIL a second run changed something"; exit 1; }
            echo "ok   a second run changes nothing"'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
